<div *ngIf="!paymentDone">
  <button (click)="makePayment()">Pay Initial Amount</button>
</div>

<div *ngIf="paymentDone">
  <p>Payment done successfully!</p>

  <div *ngIf="activeGroup?.group_name && canBidThisMonth">
    <p>
      Do you wish to withdraw money for this month from
      <strong>{{ activeGroup.group_name }}</strong>?
    </p>
    <button (click)="placeBid()">Yes, Place My Bid</button>
  </div>

  <div *ngIf="!canBidThisMonth && activeGroup?.group_name">
    <p class="text-red">You are not eligible to place a bid this month.</p>
  </div>
</div>
