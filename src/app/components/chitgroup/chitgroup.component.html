<div class="group-grid">
  <div 
    class="group-card clickable-card"
    *ngFor="let group of allGroups"
    (click)="viewAuction(group._id)"
  >
    <h3>{{ group.group_name }}</h3>
    <p><strong>Value:</strong> ₹{{ group.chit_value }}</p>
    <p><strong>Duration:</strong> {{ group.duration }} months</p>
    <p><strong>Monthly Contribution:</strong> ₹{{ group.monthly_contribution }}</p>
    <p><strong>Total Members:</strong> {{ group.total_members }}</p>
    <p><strong>Status:</strong> {{ group.status }}</p>

    <!-- Show auction status outside -->
    <div *ngIf="isAdmin">
  <ng-container *ngIf="activeAuctionGroupIds.has(group._id); else startAuctionBlock">
    <button disabled>Auction Already Started</button>
    <button (click)="viewAuction(group._id)">View Auction</button>
  </ng-container>

  <ng-template #startAuctionBlock>
    <button (click)="startAuction(group._id)">Start Auction</button>
  </ng-template>
</div>

  </div>
</div>
