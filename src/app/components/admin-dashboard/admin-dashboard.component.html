<div class="admin-dashboard">
  <h2>Welcome, Admin</h2>

  <div class="dashboard-cards">
    <div class="card" (click)="navigateTo('chits/create')">
      <div class="card-content">
        <h3>Create New Chit Group</h3>
        <p>Click to create a new chit group and configure its details.</p>
      </div>
    </div>

    <div class="card" (click)="navigateTo('chits/view')">
      <div class="card-content">
        <h3>View All Chit Groups</h3>
        <p>Explore and manage all existing chit groups.</p>
      </div>
    </div>
  </div>
</div>
